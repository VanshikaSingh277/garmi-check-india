# Lint, type and security settings for the API (spec §10.4 checks). Run from apps/api.

# Vercel installs from [project] when this file exists and ignores requirements.txt, so the pins are repeated here.
# Keep them the same as requirements.txt (the Docker image installs from requirements.lock).
[project]
name = "thandak-api"
version = "0.3.0"
requires-python = ">=3.11,<3.13"  # numpy 1.26.4 has no wheels for 3.13+
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "httpx==0.28.1",
    "numpy==1.26.4",
    "xgboost-cpu==2.1.4",
    "shapely==2.0.6",
    "tzdata==2026.5",
    "scikit-learn==1.5.2",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "apscheduler==3.11.3",
    "cryptography==50.0.2",
    "sentry-sdk==2.73.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 200
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E702"]   # the gazetteer loader keeps short paired statements on one line

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as argument defaults on purpose
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

# gazetteer, fix catalogue and district modules predate the backend spec; typing them is outside the build
[[tool.mypy.overrides]]
module = ["engine.places", "engine.solutions", "engine.districts"]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests"]
